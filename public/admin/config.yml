        fields:
          - label: "Logo 文字"
            name: "logoText"
            widget: "string"
          - label: "菜单项"
            name: "menu"
            widget: "list"
            fields:
              - label: "菜单文字"
                name: "label"
                widget: "string"
              - label: "链接地址"
                name: "url"
                widget: "string"
          - label: "购买按钮"
            name: "shopButton"
