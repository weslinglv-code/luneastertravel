  # 7. 网站全局设置
  # ==================================================
  - name: "settings"
    label: "⚙️ 网站设置"
    description: "全站基础配置：网站标题、社交链接、目的地管理等。"
    delete: false
    files:
      # --- 全站基础设置 ---
      - file: "src/data/site-settings.json"
        name: "siteSettings"
        label: "🌐 全站基础设置"
        fields:
          - label: "网站标题"
            name: "siteTitle"
            widget: "string"
          - label: "网站简介"
            name: "siteDescription"
            widget: "text"
          - label: "询盘接收邮箱"
            name: "inquiryEmail"
            widget: "string"
            hint: "Custom Trip 表单提交后接收通知的邮箱"
          - label: "社交媒体链接"
            name: "socialLinks"
            widget: "list"
            fields:
              - label: "平台名称"
