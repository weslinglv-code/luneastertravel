# =====================================================
# Sveltia CMS Configuration (Chinese UI)
# =====================================================
# 访问地址: https://luneastertravel.com/admin/
# 登录方式: GitHub Token 登录
# 保存后自动部署: CMS 提交 → GitHub → 自动构建 → 1-2分钟上线
# =====================================================

locale: 'zh_Hans'

backend:
  name: github
  repo: weslinglv-code/luneastertravel
  branch: main

site_url: https://luneastertravel.com
display_url: https://luneastertravel.com

media_folder: "public/images"
public_folder: "/images"

commit_messages:
  create: "CMS: 创建 {{collection}} - {{slug}}"
  update: "CMS: 更新 {{collection}} - {{slug}}"
  delete: "CMS: 删除 {{collection}} - {{slug}}"
  uploadMedia: "CMS: 上传图片 {{path}}"
  deleteMedia: "CMS: 删除图片 {{path}}"

collections:
  # ==================================================
  # 1. 付费 PDF 攻略（主营核心，置顶）
  # ==================================================
  - name: "products"
    label: "📦 付费 PDF 攻略"
    label_singular: "商品"
    folder: "src/data/products"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    summary: "{{title}} — {{priceLabel}}"
    description: "主营付费 PDF 旅行攻略。点击商品进入编辑，新增商品点右上角 + 按钮。"
    fields:
      # --- 板块 1: 基础商品信息 ---
      - label: "商品标题"
        name: "title"
        widget: "string"
        hint: "与 Gumroad 同步标题"
      - label: "页面路径 (URL Slug)"
        name: "slug"
        widget: "string"
        hint: "必须与文件名一致（不含 .json），如 okinawa-4day-slow-travel"
      - label: "短摘要 (Google SEO 卡片)"
        name: "description"
        widget: "text"
        hint: "用于搜索结果卡片，建议 70-160 字符"
      - label: "搜索标签"
        name: "tags"
        widget: "list"
        required: false
        hint: "逗号分隔的搜索关键词"
      - label: "Gumroad 购买链接"
        name: "gumroadUrl"
        widget: "string"
        hint: "Gumroad 商品页面完整 URL"
      - label: "商品状态"
        name: "status"
        widget: "select"
        options:
          - "published"
          - "draft"
        default: "published"
        hint: "draft = 草稿模式，不在前台显示"
      # --- 板块 2: 封面 & 预览素材 ---
      - label: "主封面图"
        name: "coverImage"
        widget: "image"
        required: false
        hint: "上传或从图库选择商品主封面图"
      - label: "预览图集"
        name: "galleryImages"
        widget: "list"
        required: false
        hint: "PDF 截图、风景实拍等预览图，可添加多张"
        field:
          label: "预览图片"
          name: "image"
          widget: "image"
      # --- 板块 3: 商品长详情 ---
      - label: "完整商品介绍 (富文本)"
        name: "longDescription"
        widget: "markdown"
        required: false
        hint: "可直接粘贴 Gumroad 详情文案，支持图片、加粗、列表"
      # --- 板块 4: 卖点列表 ---
      - label: "卖点列表"
        name: "features"
        widget: "list"
        default: []
        hint: "每条对应一个 Gumroad 卖点，点击 + 添加新卖点"
      # --- 板块 5: 行程配套信息 ---
      - label: "目的地"
        name: "destination"
        widget: "select"
        options:
          - ""
          - "okinawa"
          - "kyoto"
          - "tokyo"
          - "osaka"
          - "mt-fuji"
          - "wakayama"
          - "hokkaido"
        default: ""
        required: false
        hint: "选择商品对应的目的地，用于自动生成地区合集页"
      - label: "行程天数"
        name: "tripDays"
        widget: "number"
        value_type: "int"
        required: false
      - label: "出行方式"
        name: "transportType"
        widget: "select"
        options:
          - ""
          - "self-drive"
          - "public-transit"
          - "both"
        default: ""
        required: false
      - label: "打卡机位备注"
        name: "photographySpots"
        widget: "text"
        required: false
      - label: "美食贴士"
        name: "foodGuideNotes"
        widget: "text"
        required: false
      # --- 板块 6: 价格 & 排序 ---
      - label: "副标题"
        name: "subtitle"
        widget: "string"
      - label: "价格 (数字)"
        name: "price"
        widget: "number"
        value_type: "float"
        default: 4.99
      - label: "价格显示文字"
        name: "priceLabel"
        widget: "string"
        default: "$4.99"
      - label: "页数"
        name: "pages"
        widget: "number"
        value_type: "int"
        default: 10
      - label: "排序权重 (数字越小越靠前)"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 99
      - label: "徽章标签"
        name: "badge"
        widget: "string"
        required: false
        hint: "如 New / Bestseller"
      - label: "主题色 (十六进制)"
        name: "accentColor"
        widget: "string"
        default: "#e85d4a"
        hint: "#e85d4a 红色 / #0ea5e9 蓝色 / #059669 绿色 / #f5a623 橙色"
      # --- 板块 7: SEO 独立分区 ---
      - label: "SEO 标题"
        name: "metaTitle"
        widget: "string"
        required: false
        hint: "留空则自动使用商品标题"
      - label: "SEO 描述"
        name: "metaDescription"
        widget: "text"
        required: false
        hint: "留空则自动使用短摘要"
      - label: "SEO 关键词"
        name: "metaKeywords"
        widget: "string"
        required: false
        hint: "逗号分隔，如 japan,okinawa,itinerary"

  # ==================================================
  # 2. 旅行博客（流量核心转化入口）
  # ==================================================
  - name: "blog"
    label: "📝 旅行博客"
    label_singular: "文章"
    folder: "src/content/blog"
    create: true
    delete: true
    extension: "md"
    format: "yaml-frontmatter"
    slug: "{{fields.slug}}"
    summary: "{{title}} — {{pubDate}}"
    description: "免费博客流量文章。新建文章时可参考已有文章的格式复制内容。联盟链接用 [文字](#aff:key) 写法。"
    fields:
      - label: "URL 路径 (英文)"
        name: "slug"
        widget: "string"
        hint: "文章 URL，只能小写英文+数字+连字符，如 osaka-3-day-hidden-gems。禁止填完整网址！"
        pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "只能小写英文、数字和连字符，不能包含空格、中文或 http"]
      - label: "文章标题"
        name: "title"
        widget: "string"
      - label: "文章摘要 (SEO)"
        name: "description"
        widget: "text"
        hint: "搜索结果卡片简介，70-160 字符"
      - label: "发布日期"
        name: "pubDate"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: "更新日期 (可选)"
        name: "updatedDate"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
      - label: "封面图"
        name: "coverImage"
        widget: "image"
        required: false
      - label: "封面图替代文字"
        name: "coverAlt"
        widget: "string"
        required: false
      - label: "目的地标签"
        name: "destination"
        widget: "select"
        options:
          - ""
          - "okinawa"
          - "kyoto"
          - "tokyo"
          - "osaka"
          - "mt-fuji"
          - "wakayama"
          - "hokkaido"
        default: ""
        required: false
        hint: "选择目的地，用于自动生成地区博客归档页"
      - label: "文章标签"
        name: "tags"
        widget: "list"
        default:
          - "Japan"
      - label: "作者"
        name: "author"
        widget: "string"
        default: "LuneAster"
      - label: "阅读时间"
        name: "readingTime"
        widget: "string"
        required: false
        hint: "如 8 min read"
      - label: "首页推荐"
        name: "featured"
        widget: "boolean"
        default: false
      - label: "草稿 (不发布)"
        name: "draft"
        widget: "boolean"
        default: false
      - label: "正文内容"
        name: "body"
        widget: "markdown"
        hint: "联盟链接: [文字](#aff:key) — 可用 key: klook_jrpass / klook_pocket_wifi / klook_tokyo_disney / klook_mt_fuji / tp_flights / amazon_adapter / amazon_powerbank / amazon_guidebook. 插入 CTA: <div data-cta=\"light\"></div> (软引导) 或 <div data-cta=\"button\"></div> (橙色按钮). 站内链接: [文字](/blog/article-slug)."
      # --- SEO 独立分区 ---
      - label: "SEO 标题"
        name: "metaTitle"
        widget: "string"
        required: false
        hint: "留空则自动使用文章标题"
      - label: "SEO 描述"
        name: "metaDescription"
        widget: "text"
        required: false
        hint: "留空则自动使用文章摘要"
      - label: "SEO 关键词"
        name: "metaKeywords"
        widget: "string"
        required: false
        hint: "逗号分隔，如 japan,osaka,food guide"

  # ==================================================
  # 3. 客户咨询（定制旅行询盘管理）
  # ==================================================
  - name: "inquiries"
    label: "📋 客户咨询"
    label_singular: "询盘"
    folder: "src/data/inquiries"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    summary: "{{email}} — {{status}}"
    description: "Custom Trip 表单提交的询盘记录。可编辑跟进状态和内部备注。自动接入需配置 Cloudflare Worker。"
    fields:
      - label: "提交时间"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
      - label: "访客邮箱"
        name: "email"
        widget: "string"
      - label: "目的地"
        name: "destination"
        widget: "select"
        options:
          - ""
          - "okinawa"
          - "kyoto"
          - "tokyo"
          - "osaka"
          - "mt-fuji"
          - "wakayama"
          - "hokkaido"
        default: ""
        required: false
      - label: "出行日期"
        name: "travelDate"
        widget: "string"
        required: false
      - label: "出行人数"
        name: "numTravellers"
        widget: "number"
        value_type: "int"
        required: false
      - label: "出行类型"
        name: "tripStyle"
        widget: "string"
        required: false
      - label: "留言内容"
        name: "message"
        widget: "text"
      - label: "跟进状态"
        name: "status"
        widget: "select"
        options:
          - "pending"
          - "communicating"
          - "won"
          - "voided"
        default: "pending"
        hint: "pending=待回复 / communicating=沟通中 / won=成交 / voided=作废"
      - label: "内部备注"
        name: "notes"
        widget: "text"
        required: false
        hint: "记录沟通进度和内部信息"

  # ==================================================
  # 4. 联盟链接管理（隔离佣金业务，不干扰主营编辑）
  # ==================================================
  - name: "affiliates"
    label: "🔗 联盟链接管理"
    description: "全站联盟推广链接统一管理。修改 URL 或启停不影响商品和博客编辑。"
    delete: false
    files:
      - file: "src/data/affiliates-data.json"
        name: "affiliates"
        label: "联盟链接库"
        fields:
          - label: "链接列表"
            name: "links"
            widget: "list"
            hint: "每条链接对应一个 #aff:key，博客和页面通过 key 引用"
            fields:
              - label: "内部 Key (博客引用用)"
                name: "key"
                widget: "string"
                hint: "如 klook_jrpass，博客中用 [文字](#aff:klook_jrpass) 引用"
              - label: "显示名称"
                name: "label"
                widget: "string"
              - label: "完整推广 URL"
                name: "url"
                widget: "string"
                hint: "包含联盟 ID 的完整链接"
              - label: "合作平台"
                name: "brand"
                widget: "select"
                options:
                  - "Klook"
                  - "Booking.com"
                  - "Aviasales"
                  - "Amazon"
              - label: "链接类型"
                name: "type"
                widget: "select"
                options:
                  - "transport"
                  - "hotel"
                  - "ticket"
                  - "tour"
                  - "sim"
                  - "gear"
              - label: "描述"
                name: "description"
                widget: "text"
                required: false
              - label: "图标"
                name: "icon"
                widget: "select"
                options:
                  - "train"
                  - "wifi"
                  - "ticket"
                  - "mountain"
                  - "bed"
                  - "plane"
                  - "plug"
                  - "battery"
                  - "book"
              - label: "启用"
                name: "enabled"
                widget: "boolean"
                default: true
                hint: "关闭后该链接不会在全站生效"

  # ==================================================
  # 5. 页面编辑（首页 & 独立页面可视化编辑）
  # ==================================================
  - name: "pages"
    label: "📄 页面编辑"
    description: "首页所有板块的图文内容均可在此编辑，保存后自动上线。"
    delete: false
    files:
      # --- 首页横幅 ---
      - file: "src/data/homepage/hero.json"
        name: "hero"
        label: "🏠 首页横幅 (Hero)"
        fields:
          - label: "背景图"
            name: "bgImage"
            widget: "image"
          - label: "标签文字"
            name: "tag"
            widget: "string"
          - label: "主标题"
            name: "title"
            widget: "string"
          - label: "高亮词"
            name: "titleHighlight"
            widget: "string"
            required: false
            hint: "标题中需要高亮显示的词"
          - label: "副标题"
            name: "subtitle"
            widget: "text"
          - label: "信任徽章"
            name: "trustBadges"
            widget: "list"
            hint: "按钮下方显示的统计数据"
            fields:
              - label: "数字"
                name: "num"
                widget: "string"
              - label: "标签"
                name: "label"
                widget: "string"
          - label: "主按钮 (橙色)"
            name: "primaryButton"
            widget: "object"
            fields:
              - label: "按钮文字"
                name: "text"
                widget: "string"
              - label: "跳转链接"
                name: "url"
                widget: "string"
          - label: "次按钮 (描边)"
            name: "secondaryButton"
            widget: "object"
            fields:
              - label: "按钮文字"
                name: "text"
                widget: "string"
              - label: "跳转链接"
                name: "url"
                widget: "string"
      # --- 四大卖点 ---
      - file: "src/data/homepage/advantages.json"
        name: "advantages"
        label: "⭐ 四大卖点"
        fields:
          - label: "板块标题"
            name: "sectionTitle"
            widget: "string"
          - label: "板块副标题"
            name: "sectionSubtitle"
            widget: "text"
          - label: "卖点卡片"
            name: "cards"
            widget: "list"
            fields:
              - label: "图标"
                name: "icon"
                widget: "select"
                options:
                  - "map"
                  - "yen"
                  - "pin"
                  - "transit"
                  - "route"
                  - "mountain"
                  - "clock"
                  - "star"
              - label: "卡片标题"
                name: "title"
                widget: "string"
              - label: "卡片描述"
                name: "description"
                widget: "text"
              - label: "显示此卡片"
                name: "visible"
                widget: "boolean"
                default: true
      # --- 付费攻略板块 ---
      - file: "src/data/homepage/premium-section.json"
        name: "premiumSection"
        label: "💳 付费攻略板块"
        fields:
          - label: "板块标题"
            name: "sectionTitle"
            widget: "string"
          - label: "板块副标题"
            name: "sectionSubtitle"
            widget: "text"
          - label: "卡片按钮文字"
            name: "buttonText"
            widget: "string"
          - label: "全部购买按钮链接"
            name: "shopAllUrl"
            widget: "string"
          - label: "全部购买按钮文字"
            name: "shopAllText"
            widget: "string"
      # --- 博客文章板块 ---
      - file: "src/data/homepage/blog-section.json"
        name: "blogSection"
        label: "📖 博客文章板块"
        fields:
          - label: "板块标题"
            name: "sectionTitle"
            widget: "string"
          - label: "板块副标题"
            name: "sectionSubtitle"
            widget: "text"
          - label: "最大展示文章数"
            name: "maxPosts"
            widget: "number"
            value_type: "int"
            default: 3
            min: 1
            max: 12
          - label: "按钮文字"
            name: "buttonText"
            widget: "string"
          - label: "按钮链接"
            name: "buttonUrl"
            widget: "string"
          - label: "仅显示英文文章"
            name: "englishOnly"
            widget: "boolean"
            default: true
            hint: "隐藏中文标题的文章"
      # --- 旅行必备 (联盟) ---
      - file: "src/data/homepage/essentials.json"
        name: "essentials"
        label: "🔗 旅行必备 (联盟按钮)"
        fields:
          - label: "板块标题"
            name: "sectionTitle"
            widget: "string"
          - label: "简介文字"
            name: "introText"
            widget: "text"
          - label: "佣金声明"
            name: "disclosureText"
            widget: "text"
            hint: "显示在简介下方的联盟声明"
          - label: "查看全部按钮文字"
            name: "viewAllText"
            widget: "string"
          - label: "查看全部按钮链接"
            name: "viewAllUrl"
            widget: "string"
          - label: "联盟按钮列表"
            name: "buttons"
            widget: "list"
            hint: "每个按钮对应一个联盟链接 key"
            fields:
              - label: "联盟链接 Key"
                name: "linkKey"
                widget: "select"
                hint: "必须与联盟链接管理中的 key 一致"
                options:
                  - "tp_flights"
                  - "klook_jrpass"
                  - "klook_pocket_wifi"
                  - "klook_tokyo_disney"
                  - "klook_mt_fuji"
                  - "amazon_adapter"
                  - "amazon_powerbank"
                  - "amazon_guidebook"
                  - "booking_tokyo_shinjuku"
                  - "booking_kyoto"
                  - "booking_osaka"
              - label: "按钮文字"
                name: "label"
                widget: "string"
      # --- 推荐引导板块 ---
      - file: "src/data/homepage/cta.json"
        name: "cta"
        label: "📣 推荐引导板块"
        fields:
          - label: "板块标题"
            name: "title"
            widget: "string"
          - label: "推荐场景"
            name: "scenarios"
            widget: "list"
            fields:
              - label: "场景标题"
                name: "title"
                widget: "string"
              - label: "描述"
                name: "description"
                widget: "text"
          - label: "按钮文字"
            name: "buttonText"
            widget: "string"
          - label: "按钮链接"
            name: "buttonUrl"
            widget: "string"
      # --- 页脚 ---
      - file: "src/data/homepage/footer.json"
        name: "footer"
        label: "📄 页脚"
        fields:
          - label: "品牌名称"
            name: "brandName"
            widget: "string"
          - label: "品牌描述"
            name: "brandDescription"
            widget: "text"
          - label: "快捷链接"
            name: "quickLinks"
            widget: "list"
            fields:
              - label: "链接文字"
                name: "label"
                widget: "string"
              - label: "链接地址"
                name: "url"
                widget: "string"
          - label: "社交媒体链接"
            name: "socialLinks"
            widget: "list"
            fields:
              - label: "平台名称"
                name: "label"
                widget: "string"
              - label: "链接地址"
                name: "url"
                widget: "string"
          - label: "联盟声明"
            name: "disclosure"
            widget: "text"
          - label: "版权文字"
            name: "copyright"
            widget: "string"
      # --- 模块排序 & 显隐 ---
      - file: "src/data/homepage/sections.json"
        name: "sections"
        label: "🔀 模块排序 & 显隐"
        fields:
          - label: "首页模块"
            name: "modules"
            widget: "list"
            hint: "数字越小越靠前。关闭 visible 可隐藏该模块。"
            fields:
              - label: "模块 ID"
                name: "id"
                widget: "string"
                hint: "不要修改: hero / advantages / blog / essentials / premium / cta / footer"
              - label: "显示名称"
                name: "label"
                widget: "string"
              - label: "显示"
                name: "visible"
                widget: "boolean"
                default: true
              - label: "排序 (1=最上)"
                name: "order"
                widget: "number"
                value_type: "int"
                default: 1
      # --- 博客文章 CTA 配置 ---
      - file: "src/data/homepage/article-cta.json"
        name: "article_cta"
        label: "📰 博客文章 CTA 配置"
        description: "博客文章页侧边栏和文末推荐卡片的配置"
        fields:
          - label: "侧边栏产品卡片"
            name: "sidebar"
            widget: "object"
