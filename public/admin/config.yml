            fields:
              - label: "卡片标签"
                name: "label"
                widget: "string"
              - label: "推荐产品"
                name: "product_slug"
                widget: "select"
                hint: "选择侧边栏推荐的商品"
                options:
                  - "kyoto-takao-three-temples"
                  - "japan-blueprint-7-day"
                  - "kyoto-3-day-autumn"
                  - "tokyo-5-day-route"
                  - "okinawa-4day-slow-travel"
                  - "wakayama-3day-mountain-sea"
              - label: "CTA 按钮文字"
                name: "cta_text"
                widget: "string"
              - label: "信任文字"
                name: "trust_text"
                widget: "string"
              - label: "社媒引流标题"
                name: "newsletter_heading"
                widget: "string"
              - label: "社媒引流内容"
                name: "newsletter_body"
                widget: "text"
              - label: "社媒按钮文字"
                name: "newsletter_cta"
                widget: "string"
              - label: "社媒链接"
                name: "newsletter_url"
                widget: "string"
          - label: "轻引导 CTA (文章内)"
            name: "light_cta"
            widget: "object"
            hint: "文章中用 <div data-cta=\"light\"></div> 插入"
            fields:
              - label: "引导文字"
                name: "text"
                widget: "text"
              - label: "链接文字"
                name: "link_text"
                widget: "string"
              - label: "链接地址"
                name: "url"
                widget: "string"
          - label: "橙色按钮 CTA (文章中)"
            name: "mid_cta"
            widget: "object"
            hint: "文章中用 <div data-cta=\"button\"></div> 插入"
            fields:
              - label: "描述文字"
                name: "text"
                widget: "text"
              - label: "按钮文字"
                name: "button_text"
                widget: "string"
              - label: "按钮链接"
                name: "url"
                widget: "string"
          - label: "文末推荐板块"
            name: "end_cta"
            widget: "object"
            fields:
              - label: "板块标签"
                name: "label"
                widget: "string"
              - label: "推荐产品"
                name: "product_slug"
                widget: "select"
                options:
                  - "kyoto-takao-three-temples"
                  - "japan-blueprint-7-day"
                  - "kyoto-3-day-autumn"
                  - "tokyo-5-day-route"
                  - "okinawa-4day-slow-travel"
                  - "wakayama-3day-mountain-sea"
              - label: "CTA 按钮文字"
                name: "cta_text"
                widget: "string"
              - label: "次级链接文字"
                name: "secondary_text"
                widget: "string"
              - label: "次级链接地址"
                name: "secondary_url"
                widget: "string"

  # ==================================================
  # 6. 导航栏管理
  # ==================================================
  - name: "navigation"
    label: "🧭 导航栏管理"
