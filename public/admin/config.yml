# =====================================================
# Sveltia CMS Configuration
# =====================================================
# Local:  http://localhost:4321/admin/index.html → "Work with Local Repository"
# Online: https://luneastertravel.com/admin/ → GitHub Token login
# =====================================================

backend:
  name: github
  repo: weslinglv-code/luneastertravel
  branch: main

site_url: https://luneastertravel.com
display_url: https://luneastertravel.com

media_folder: "public/images"
public_folder: "/images"

commit_messages:
  create: "CMS: Created {{collection}} - {{slug}}"
  update: "CMS: Updated {{collection}} - {{slug}}"
  delete: "CMS: Deleted {{collection}} - {{slug}}"
  uploadMedia: "CMS: Uploaded image {{path}}"
  deleteMedia: "CMS: Deleted image {{path}}"

collections:
  # ========== HOMEPAGE MODULE ORDER & VISIBILITY ==========
  - name: "homepage_sections"
    label: "🏠 Module Order & Visibility"
    description: "Control the display order and show/hide of homepage sections. Toggle visible to show/hide, change order number for position."
    delete: false
    files:
      - file: "src/data/homepage/sections.json"
        name: "sections"
        label: "Homepage Modules"
        fields:
          - label: "Modules"
            name: "modules"
            widget: "list"
            hint: "Lower order number = appears higher on page. Toggle visible to show/hide."
            fields:
              - label: "Module ID"
                name: "id"
                widget: "string"
                hint: "Do not change: hero, advantages, blog, essentials, premium, cta, footer"
              - label: "Display Name"
                name: "label"
                widget: "string"
              - label: "Visible"
                name: "visible"
                widget: "boolean"
                default: true
              - label: "Order (1=top)"
                name: "order"
                widget: "number"
                value_type: "int"
                default: 1

  # ========== HERO BANNER ==========
  - name: "homepage_hero"
    label: "🎯 Hero Banner"
    description: "First screen visitors see — background image, title, subtitle, trust badges, CTA buttons"
    delete: false
    files:
      - file: "src/data/homepage/hero.json"
        name: "hero"
        label: "Hero Section"
        fields:
          - label: "Background Image"
            name: "bgImage"
            widget: "image"
            hint: "Upload or select your real Kansai travel photo"
          - label: "Tag Text"
            name: "tag"
            widget: "string"
            hint: "Small label above the title"
          - label: "Main Title"
            name: "title"
            widget: "string"
          - label: "Title Highlight Word"
            name: "titleHighlight"
            widget: "string"
            required: false
            hint: "Word in title to highlight in accent color"
          - label: "Subtitle"
            name: "subtitle"
            widget: "text"
          - label: "Trust Badges"
            name: "trustBadges"
            widget: "list"
            hint: "Stats shown below the buttons"
            fields:
              - label: "Number"
                name: "num"
                widget: "string"
              - label: "Label"
                name: "label"
                widget: "string"
          - label: "Primary Button (Orange)"
            name: "primaryButton"
            widget: "object"
            fields:
              - label: "Button Text"
                name: "text"
                widget: "string"
              - label: "Button URL"
                name: "url"
                widget: "string"
          - label: "Secondary Button (Outline)"
            name: "secondaryButton"
            widget: "object"
            fields:
              - label: "Button Text"
                name: "text"
                widget: "string"
              - label: "Button URL"
                name: "url"
                widget: "string"

  # ========== CORE ADVANTAGES ==========
  - name: "homepage_advantages"
    label: "⭐ Core Advantages"
    description: "4-column cards highlighting why your guides are different"
    delete: false
    files:
      - file: "src/data/homepage/advantages.json"
        name: "advantages"
        label: "Advantage Cards"
        fields:
          - label: "Section Title"
            name: "sectionTitle"
            widget: "string"
          - label: "Section Subtitle"
            name: "sectionSubtitle"
            widget: "text"
          - label: "Advantage Cards"
            name: "cards"
            widget: "list"
            fields:
              - label: "Icon"
                name: "icon"
                widget: "select"
                hint: "Outline SVG icon (2px black stroke, 48x48). map=route, yen=budget, pin=local spots, transit=train"
                options:
                  - "map"
                  - "yen"
                  - "pin"
                  - "transit"
                  - "route"
                  - "mountain"
                  - "clock"
                  - "star"
              - label: "Card Title"
                name: "title"
                widget: "string"
              - label: "Card Description"
                name: "description"
                widget: "text"
              - label: "Show This Card"
                name: "visible"
                widget: "boolean"
                default: true

  # ========== FREE BLOG SECTION ==========
  - name: "homepage_blog"
    label: "📖 Free Blog Section"
    description: "Settings for the free blog articles section on homepage"
    delete: false
    files:
      - file: "src/data/homepage/blog-section.json"
        name: "blogSection"
        label: "Blog Section Settings"
        fields:
          - label: "Section Title"
            name: "sectionTitle"
            widget: "string"
          - label: "Section Subtitle"
            name: "sectionSubtitle"
            widget: "text"
          - label: "Max Posts to Show"
            name: "maxPosts"
            widget: "number"
            value_type: "int"
            default: 3
            min: 1
            max: 12
          - label: "Button Text"
            name: "buttonText"
            widget: "string"
          - label: "Button URL"
            name: "buttonUrl"
            widget: "string"
          - label: "English Posts Only"
            name: "englishOnly"
            widget: "boolean"
            default: true
            hint: "Hide Chinese-titled posts from homepage"

  # ========== PREMIUM PDF SECTION ==========
  - name: "homepage_premium"
    label: "💳 Premium PDF Section"
    description: "Settings for the paid PDF guides section"
    delete: false
    files:
      - file: "src/data/homepage/premium-section.json"
        name: "premiumSection"
        label: "Premium Section Settings"
        fields:
          - label: "Section Title"
            name: "sectionTitle"
            widget: "string"
          - label: "Section Subtitle"
            name: "sectionSubtitle"
            widget: "text"
          - label: "Card Button Text"
            name: "buttonText"
            widget: "string"
            hint: "Text on each product card"
          - label: "Shop All Button URL"
            name: "shopAllUrl"
            widget: "string"
          - label: "Shop All Button Text"
            name: "shopAllText"
            widget: "string"

  # ========== TRAVEL ESSENTIALS (AFFILIATE) ==========
  - name: "homepage_essentials"
    label: "🔗 Travel Essentials (Affiliate)"
    description: "Affiliate booking buttons section on homepage — flights, hotels, JR Pass, WiFi, tickets"
    delete: false
    files:
      - file: "src/data/homepage/essentials.json"
        name: "essentials"
        label: "Travel Essentials Section"
        fields:
          - label: "Section Title"
            name: "sectionTitle"
            widget: "string"
          - label: "Intro Text"
            name: "introText"
            widget: "text"
          - label: "Disclosure Text"
            name: "disclosureText"
            widget: "text"
            hint: "Commission disclosure shown under intro"
          - label: "View All Button Text"
            name: "viewAllText"
            widget: "string"
          - label: "View All Button URL"
            name: "viewAllUrl"
            widget: "string"
          - label: "Affiliate Buttons"
            name: "buttons"
            widget: "list"
            hint: "Each button links to an affiliate key defined in affiliate-links.js"
            fields:
              - label: "Affiliate Link Key"
                name: "linkKey"
                widget: "select"
                hint: "Must match a key in src/data/affiliate-links.js"
                options:
                  - "tp_flights"
                  - "booking_kyoto"
                  - "booking_tokyo_shinjuku"
                  - "booking_osaka"
                  - "klook_jrpass"
                  - "klook_pocket_wifi"
                  - "klook_tokyo_disney"
                  - "klook_mt_fuji"
                  - "amazon_adapter"
                  - "amazon_powerbank"
                  - "amazon_guidebook"
              - label: "Button Label"
                name: "label"
                widget: "string"

  # ========== CTA SECTION ==========
  - name: "homepage_cta"
    label: "📣 Guide Recommendation CTA"
    description: "The 'Not sure which guide?' section with scenario recommendations"
    delete: false
    files:
      - file: "src/data/homepage/cta.json"
        name: "cta"
        label: "CTA Section"
        fields:
          - label: "Section Title"
            name: "title"
            widget: "string"
          - label: "Recommendation Scenarios"
            name: "scenarios"
            widget: "list"
            fields:
              - label: "Scenario Title"
                name: "title"
                widget: "string"
              - label: "Description"
                name: "description"
                widget: "text"
          - label: "Button Text"
            name: "buttonText"
            widget: "string"
          - label: "Button URL"
            name: "buttonUrl"
            widget: "string"

  # ========== FOOTER ==========
  - name: "homepage_footer"
    label: "📄 Footer"
    description: "Brand info, quick links, social links, affiliate disclosure"
    delete: false
    files:
      - file: "src/data/homepage/footer.json"
        name: "footer"
        label: "Footer Content"
        fields:
          - label: "Brand Name"
            name: "brandName"
            widget: "string"
          - label: "Brand Description"
            name: "brandDescription"
            widget: "text"
          - label: "Quick Links"
            name: "quickLinks"
            widget: "list"
            fields:
              - label: "Link Text"
                name: "label"
                widget: "string"
              - label: "URL"
                name: "url"
                widget: "string"
          - label: "Social Links"
            name: "socialLinks"
            widget: "list"
            fields:
              - label: "Platform Name"
                name: "label"
                widget: "string"
              - label: "URL"
                name: "url"
                widget: "string"
          - label: "Affiliate Disclosure"
            name: "disclosure"
            widget: "text"
          - label: "Copyright Text"
            name: "copyright"
            widget: "string"

  # ========== BLOG ARTICLE SIDEBAR & END-OF-ARTICLE CTA ==========
  - name: "article_cta"
    label: "📰 Blog Article Sidebar & End CTA"
    description: "Choose which products display in blog article sidebar and end-of-article recommendation block, plus all surrounding labels"
    delete: false
    files:
      - file: "src/data/homepage/article-cta.json"
        name: "article_cta"
        label: "Article CTA Config"
        fields:
          - label: "Sidebar Product Card"
            name: "sidebar"
            widget: "object"
            hint: "Right-side sticky card on every blog article (desktop only)"
            fields:
              - label: "Card Label (e.g. Reader's Pick)"
                name: "label"
                widget: "string"
              - label: "Product Slug"
                name: "product_slug"
                widget: "select"
                hint: "Choose which product to feature in sidebar"
                options:
                  - "kyoto-takao-three-temples"
                  - "japan-blueprint-7-day"
                  - "kyoto-3-day-autumn"
                  - "tokyo-5-day-route"
                  - "okinawa-4day-slow-travel"
                  - "wakayama-3day-mountain-sea"
              - label: "CTA Button Text"
                name: "cta_text"
                widget: "string"
              - label: "Trust Text (under button)"
                name: "trust_text"
                widget: "string"
              - label: "Newsletter Heading"
                name: "newsletter_heading"
                widget: "string"
              - label: "Newsletter Body"
                name: "newsletter_body"
                widget: "text"
              - label: "Newsletter Button Text"
                name: "newsletter_cta"
                widget: "string"
              - label: "Newsletter URL (TikTok / IG / etc.)"
                name: "newsletter_url"
                widget: "string"
          - label: "Light Hint CTA (in-article, top section)"
            name: "light_cta"
            widget: "object"
            hint: "Soft text + link CTA inserted after the budget tier table. Add to article with: <div data-cta=\"light\"></div>"
            fields:
              - label: "Hint Text"
                name: "text"
                widget: "text"
                hint: "Short persuasive text (1-2 sentences)"
              - label: "Link Text"
                name: "link_text"
                widget: "string"
                hint: "e.g. See the blueprint →"
              - label: "Link URL (Gumroad / product page)"
                name: "url"
                widget: "string"
          - label: "Mid-Article Button CTA (after budget breakdown)"
            name: "mid_cta"
            widget: "object"
            hint: "Dark block with orange button, inserted after Sample 7-Day Budget Breakdown. Add to article with: <div data-cta=\"button\"></div>"
            fields:
              - label: "Description Text"
                name: "text"
                widget: "text"
                hint: "Pain-point style text explaining why they need the PDF"
              - label: "Button Text"
                name: "button_text"
                widget: "string"
                hint: "e.g. Get the Full Budget & Itinerary Blueprint →"
              - label: "Button URL (Gumroad / product page)"
                name: "url"
                widget: "string"
          - label: "End-of-Article CTA Block"
            name: "end_cta"
            widget: "object"
            hint: "Bottom recommendation block in blog articles"
            fields:
              - label: "Block Label (e.g. Recommended PDF Guide)"
                name: "label"
                widget: "string"
              - label: "Product Slug"
                name: "product_slug"
                widget: "select"
                hint: "Choose which product to recommend at end of article"
                options:
                  - "kyoto-takao-three-temples"
                  - "japan-blueprint-7-day"
                  - "kyoto-3-day-autumn"
                  - "tokyo-5-day-route"
                  - "okinawa-4day-slow-travel"
                  - "wakayama-3day-mountain-sea"
              - label: "CTA Button Text"
                name: "cta_text"
                widget: "string"
              - label: "Secondary Link Text (e.g. Browse all guides)"
                name: "secondary_text"
                widget: "string"
              - label: "Secondary Link URL"
                name: "secondary_url"
                widget: "string"

  # ========== NAVIGATION BAR ==========
  - name: "homepage_navigation"
    label: "🧭 Navigation Bar"
    description: "Top navigation menu links and Shop button"
    delete: false
    files:
      - file: "src/data/homepage/navigation.json"
        name: "navigation"
        label: "Navigation Settings"
        fields:
          - label: "Logo Text"
            name: "logoText"
            widget: "string"
          - label: "Menu Items"
            name: "menu"
            widget: "list"
            fields:
              - label: "Menu Item Text"
                name: "label"
                widget: "string"
              - label: "URL"
                name: "url"
                widget: "string"
          - label: "Shop Button"
            name: "shopButton"
            widget: "object"
            fields:
              - label: "Button Text"
                name: "text"
                widget: "string"
              - label: "Button URL"
                name: "url"
                widget: "string"

  # ========== BLOG ARTICLES ==========
  - name: "blog"
    label: "📝 Blog Articles"
    label_singular: "Article"
    folder: "src/content/blog"
    create: true
    delete: true
    extension: "md"
    format: "yaml-frontmatter"
    slug: "{{fields.slug}}"
    summary: "{{title}} — {{pubDate}}"
    fields:
      - label: "URL Slug (English, hyphenated)"
        name: "slug"
        widget: "string"
        hint: "Article URL, must be English, e.g. osaka-3-day-hidden-gems"
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Description (SEO)"
        name: "description"
        widget: "text"
      - label: "Publish Date"
        name: "pubDate"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: "Updated Date (optional)"
        name: "updatedDate"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
      - label: "Cover Image"
        name: "coverImage"
        widget: "image"
        required: false
      - label: "Cover Alt Text"
        name: "coverAlt"
        widget: "string"
        required: false
      - label: "Tags"
        name: "tags"
        widget: "list"
        default:
          - "Japan"
      - label: "Author"
        name: "author"
        widget: "string"
        default: "LuneAster"
      - label: "Reading Time"
        name: "readingTime"
        widget: "string"
        required: false
        hint: "e.g. 8 min read"
      - label: "Featured on Homepage"
        name: "featured"
        widget: "boolean"
        default: false
      - label: "Draft (not published)"
        name: "draft"
        widget: "boolean"
        default: false
      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Affiliate links: [text](#aff:key) — keys: klook_jrpass / klook_pocket_wifi / klook_tokyo_disney / klook_mt_fuji / tp_flights / amazon_adapter / amazon_powerbank / amazon_guidebook. Insert CTAs: <div data-cta=\"light\"></div> (soft hint) or <div data-cta=\"button\"></div> (orange button). Internal links: [text](/blog/article-slug)."

  # ========== PAID PRODUCTS ==========
  - name: "products"
    label: "💳 Paid Products"
    label_singular: "Product"
    folder: "src/data/products"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    summary: "{{title}} — {{priceLabel}}"
    fields:
      - label: "Display Order (lower=first)"
        name: "order"
        widget: "number"
        default: 99
        value_type: "int"
      - label: "URL Slug"
        name: "slug"
        widget: "string"
        hint: "Must match filename (without .json), e.g. japan-blueprint-7-day"
      - label: "Product Name"
        name: "title"
        widget: "string"
      - label: "Subtitle"
        name: "subtitle"
        widget: "string"
      - label: "Price (number)"
        name: "price"
        widget: "number"
        value_type: "float"
        default: 4.99
      - label: "Price (display)"
        name: "priceLabel"
        widget: "string"
        default: "$4.99"
      - label: "Pages"
        name: "pages"
        widget: "number"
        value_type: "int"
        default: 10
      - label: "Description"
        name: "description"
        widget: "text"
      - label: "Features"
        name: "features"
        widget: "list"
        default: []
      - label: "Gumroad URL"
        name: "gumroadUrl"
        widget: "string"
      - label: "Cover Image (optional)"
        name: "coverImage"
        widget: "image"
        required: false
      - label: "Badge (optional: New/Bestseller)"
        name: "badge"
        widget: "string"
        required: false
      - label: "Accent Color (hex)"
        name: "accentColor"
        widget: "string"
        default: "#e85d4a"
        hint: "#e85d4a red / #5b8def blue / #f5a623 orange / #d97706 dark-orange"
